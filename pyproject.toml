[tool.poetry]
name = "emotionpredictor"
version = "0.1.0"
description = "EmotionPredictor: Picture affect prediction using CLIP"
authors = ["Robin Szymczak"]
readme = "README.md"
packages = [{include = "emotionpredictor"}]

[tool.poetry.dependencies]
python = "^3.9"
torch = "^2.0.0"
torchvision = "^0.15.0"
scikit-learn = "^1.3.0"
pandas = "^2.0.0"
matplotlib = "^3.7.0"
plotly = "^5.17.0"
seaborn = "^0.12.0"
Pillow = "^10.0.0"
jupyter = "^1.0.0"
tqdm = "^4.66.0"
termcolor = "^2.3.0"
dash = "^2.14.0"
requests = "^2.31.0"
numpy = "^1.24.0"
ipython = "^8.0.0"
clip-by-openai = {git = "https://github.com/openai/CLIP.git"}

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

